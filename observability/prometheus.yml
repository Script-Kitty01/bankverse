global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bankverse-next
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: bankverse-next

  - job_name: bankverse-ml
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: bankverse-ml

rule_files:
  - /etc/prometheus/alerts.yml
